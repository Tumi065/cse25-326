<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="heritage_style.css">
</head>
<body class="contact-page">

    <header>
        <div class="logo"><a href="index.html">Sanele Timepieces.</a></div>
        <nav>
            <a href="index.html">Welcome</a>
            <a href="home.html">Home</a>  
            <a href="about.html">About</a>
            <a href="collection.html">Collection</a>
            <a href="service.html">Service</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="contact-container container my-5">
        <h2 class="mb-4">Request a Private Consultation</h2> 
        
        <form action="">
            <div class="row g-2">
                <div class="col">
                    <input type="text" class="form-control" placeholder="Full Name" name="name" required>
                </div>
                <div class="col">
                    <input type="email" class="form-control" placeholder="Enter email" name="email" required>
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-primary rounded-pill px-4">Submit</button>
                </div>
            </div>
        </form>
        
        <p class="mt-4">Get in touch with us, We'd love to hear from you!!!</p> 
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
